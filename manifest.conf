# RFNM SDK component manifest: name  clone-dir  url  branch
# Directory names are load-bearing: the la9310-driver build references sibling trees
# (la93xx_host_sw, diora-sdk-open-source, imx8mp-kernel, la93xx_freertos) by name.
# `./rfnm-sdk init` clones everything below into sources/; `./rfnm-sdk update` pulls.
librfnm         librfnm             https://github.com/rfnm/librfnm.git             dev-v2
la9310-driver   la93xx_host_sw      https://github.com/rfnm/la9310-driver.git       main
la9310-freertos la93xx_freertos     https://github.com/rfnm/la9310-freertos.git     main
imx8mp-kernel   imx8mp-kernel       https://github.com/rfnm/imx8mp-kernel.git       rfnm_6.6.36
imx8mp-m7       imx8mp-m7           https://github.com/rfnm/imx8mp-m7.git           main
mcux-sdk        mcux-sdk            https://github.com/nxp-mcuxpresso/mcux-sdk.git  MCUX_2.14.0
diora-sdk       diora-sdk-open-source https://github.com/rfnm/diora-sdk-open-source.git main
webgui          webgui              https://github.com/rfnm/webgui.git              main
vsg             vsg                 https://github.com/rfnm/vsg.git                 main
apps            apps                https://github.com/rfnm/apps.git                main
# optional ecosystem plugins (cloned with `./rfnm-sdk init --plugins`)
#plugin: gr-rfnm     gr-rfnm       https://github.com/rfnm/gr-rfnm.git     main
#plugin: soapy-rfnm  soapy-rfnm    https://github.com/rfnm/soapy-rfnm.git  dev-v2
#plugin: matlab-rfnm matlab-rfnm   https://github.com/rfnm/matlab-rfnm.git main
#plugin: rfnmctl     rfnmctl       https://github.com/rfnm/rfnmctl.git     master
